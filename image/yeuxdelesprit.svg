<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480" role="img" aria-label="Yeux de l'esprit - E-commerce Mode Adaptée">
  <defs>
    <radialGradient id="yeuxGlow" cx="50%" cy="20%" r="85%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity=".35"/>
      <stop offset="70%" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity=".2"/>
      <stop offset="100%" stop-color="#ec4899" stop-opacity=".1"/>
    </linearGradient>
  </defs>
  <rect width="800" height="480" fill="#121212"/>
  <rect width="800" height="480" fill="url(#yeuxGlow)"/>
  
  <!-- E-commerce Interface mockup -->
  <rect x="100" y="120" width="600" height="300" rx="16" fill="#0f0f0f" stroke="#ec4899" stroke-width="2.5"/>
  <path d="M100 170 H700" stroke="#ffffff" stroke-opacity=".1" stroke-width="2"/>
  
  <!-- Window Controls -->
  <g fill="#ec4899" opacity=".7">
    <circle cx="130" cy="145" r="5"/>
    <circle cx="148" cy="145" r="5"/>
    <circle cx="166" cy="145" r="5"/>
  </g>
  
  <!-- Search/Cart bar -->
  <rect x="200" y="136" width="300" height="18" rx="9" fill="#ffffff" opacity=".08"/>
  <circle cx="660" cy="145" r="12" fill="#ec4899" opacity=".3"/>
  <path d="M655 145 H665 M660 140 V150" stroke="#ec4899" stroke-width="2"/>

  <!-- Product Cards -->
  <rect x="130" y="195" width="160" height="190" rx="12" fill="url(#cardGrad)" stroke="#ec4899" stroke-opacity=".4" stroke-width="1.5"/>
  <rect x="145" y="210" width="130" height="100" rx="8" fill="#ec4899" opacity=".15"/>
  <rect x="145" y="322" width="100" height="12" rx="6" fill="#ffffff" opacity=".8"/>
  <rect x="145" y="342" width="60" height="10" rx="5" fill="#ec4899" opacity=".8"/>
  
  <rect x="320" y="195" width="160" height="190" rx="12" fill="url(#cardGrad)" stroke="#8b5cf6" stroke-opacity=".4" stroke-width="1.5"/>
  <rect x="335" y="210" width="130" height="100" rx="8" fill="#8b5cf6" opacity=".15"/>
  <rect x="335" y="322" width="100" height="12" rx="6" fill="#ffffff" opacity=".8"/>
  <rect x="335" y="342" width="60" height="10" rx="5" fill="#8b5cf6" opacity=".8"/>

  <rect x="510" y="195" width="160" height="190" rx="12" fill="url(#cardGrad)" stroke="#ec4899" stroke-opacity=".4" stroke-width="1.5"/>
  <rect x="525" y="210" width="130" height="100" rx="8" fill="#ec4899" opacity=".15"/>
  <rect x="525" y="322" width="100" height="12" rx="6" fill="#ffffff" opacity=".8"/>
  <rect x="525" y="342" width="60" height="10" rx="5" fill="#ec4899" opacity=".8"/>

  <!-- Fashion Icon overlays -->
  <circle cx="210" cy="260" r="24" fill="#ec4899" opacity=".3"/>
  <text x="210" y="266" font-family="Segoe UI, sans-serif" font-size="20" fill="#ffffff" text-anchor="middle">👗</text>

  <circle cx="400" cy="260" r="24" fill="#8b5cf6" opacity=".3"/>
  <text x="400" y="266" font-family="Segoe UI, sans-serif" font-size="20" fill="#ffffff" text-anchor="middle">✨</text>

  <circle cx="590" cy="260" r="24" fill="#ec4899" opacity=".3"/>
  <text x="590" y="266" font-family="Segoe UI, sans-serif" font-size="20" fill="#ffffff" text-anchor="middle">🛍️</text>

  <text x="60" y="55" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" fill="#ffffff">Yeux de l'Esprit</text>
  <text x="60" y="82" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#ec4899">E-Commerce Mode Adaptée &amp; Inclusive</text>
</svg>
