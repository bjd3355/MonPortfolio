<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480" role="img" aria-label="MP Vision Conseil - Cabinet de Coaching et Conseil">
  <defs>
    <radialGradient id="mpGlow" cx="50%" cy="20%" r="85%">
      <stop offset="0%" stop-color="#10b981" stop-opacity=".35"/>
      <stop offset="70%" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mpCardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity=".2"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity=".1"/>
    </linearGradient>
  </defs>
  <rect width="800" height="480" fill="#121212"/>
  <rect width="800" height="480" fill="url(#mpGlow)"/>
  
  <!-- Dashboard/Corporate Interface mockup -->
  <rect x="80" y="110" width="640" height="320" rx="16" fill="#0f0f0f" stroke="#10b981" stroke-width="2.5"/>
  <path d="M80 160 H720" stroke="#ffffff" stroke-opacity=".1" stroke-width="2"/>
  
  <!-- Window Controls -->
  <g fill="#10b981" opacity=".7">
    <circle cx="110" cy="135" r="5"/>
    <circle cx="128" cy="135" r="5"/>
    <circle cx="146" cy="135" r="5"/>
  </g>

  <!-- Title Pill -->
  <rect x="180" y="126" width="220" height="18" rx="9" fill="#10b981" opacity=".2"/>

  <!-- Left Sidebar / Navigation -->
  <rect x="100" y="180" width="140" height="230" rx="10" fill="#ffffff" opacity=".04"/>
  <rect x="115" y="200" width="90" height="10" rx="5" fill="#10b981" opacity=".8"/>
  <rect x="115" y="225" width="110" height="8" rx="4" fill="#ffffff" opacity=".4"/>
  <rect x="115" y="245" width="100" height="8" rx="4" fill="#ffffff" opacity=".4"/>
  <rect x="115" y="265" width="85" height="8" rx="4" fill="#ffffff" opacity=".4"/>
  <rect x="115" y="285" width="95" height="8" rx="4" fill="#ffffff" opacity=".4"/>

  <!-- Main Content Cards -->
  <rect x="260" y="180" width="210" height="105" rx="12" fill="url(#mpCardGrad)" stroke="#10b981" stroke-opacity=".3" stroke-width="1.5"/>
  <text x="280" y="215" font-family="Segoe UI, sans-serif" font-size="22" fill="#ffffff">🎯 Vision &amp; Strategy</text>
  <rect x="280" y="235" width="170" height="8" rx="4" fill="#ffffff" opacity=".5"/>
  <rect x="280" y="255" width="130" height="8" rx="4" fill="#10b981" opacity=".8"/>

  <rect x="490" y="180" width="210" height="105" rx="12" fill="url(#mpCardGrad)" stroke="#3b82f6" stroke-opacity=".3" stroke-width="1.5"/>
  <text x="510" y="215" font-family="Segoe UI, sans-serif" font-size="22" fill="#ffffff">🚀 Leadership</text>
  <rect x="510" y="235" width="170" height="8" rx="4" fill="#ffffff" opacity=".5"/>
  <rect x="510" y="255" width="130" height="8" rx="4" fill="#3b82f6" opacity=".8"/>

  <rect x="260" y="300" width="440" height="110" rx="12" fill="url(#mpCardGrad)" stroke="#10b981" stroke-opacity=".4" stroke-width="1.5"/>
  <text x="280" y="335" font-family="Segoe UI, sans-serif" font-size="20" fill="#ffffff">🎓 Formation &amp; Coaching d'Excellence</text>
  <rect x="280" y="355" width="380" height="8" rx="4" fill="#ffffff" opacity=".4"/>
  <rect x="280" y="375" width="280" height="8" rx="4" fill="#10b981" opacity=".8"/>

  <text x="60" y="55" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" fill="#ffffff">MP Vision Conseil</text>
  <text x="60" y="82" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#10b981">Coaching, Conseil &amp; Formation en Leadership</text>
</svg>
